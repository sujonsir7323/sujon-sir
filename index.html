<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম | Self Study with Sujon Sir</title>
    <meta http-equiv="refresh" content="3.8;url=home.html">
    <style>
        /* ১ম বাণীর ফন্ট banglafont1.ttf */
        @font-face {
            font-family: 'FontOne';
            src: url('banglafont4.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* ২য় বাণীর ফন্ট banglafont2.ttf */
        @font-face {
            font-family: 'FontTwo';
            src: url('banglafont5.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ব্যাকগ্রাউন্ড আরও হালকা ও উজ্জ্বল করা হয়েছে */
            background: radial-gradient(circle at center, #005073 0%, #002d40 60%, #00151a 100%);
            overflow: hidden;
            color: white;
            font-family: sans-serif;
        }

        .intro-container {
            text-align: center;
            padding: 10px;
            width: 100%;
            max-width: 500px;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 35px;
        }

        /* লোগোর পেছনের গ্লোয়িং ইফেক্ট আরও স্বচ্ছ ও বড় করা হয়েছে */
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.25) 0%, transparent 75%);
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulseGlow 3s infinite alternate;
        }

        .intro-logo {
            width: 240px; 
            height: auto;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 45px rgba(0,0,0,0.6);
            animation: floating 4s ease-in-out infinite;
        }

        /* ১ম বাণী স্টাইল */
        .welcome-text {
            font-family: 'FontOne', sans-serif;
            font-size: 26px; 
            line-height: 1.4;
            color: #ffffff;
            margin-bottom: 18px;
            text-shadow: 0px 3px 10px rgba(0,0,0,0.4);
        }

        .welcome-text span {
            display: block;
            color: #ffffff;
            margin-top: 4px;
        }

        /* ২য় বাণী স্টাইল */
        .sub-text {
            font-family: 'FontTwo', sans-serif;
            font-size: 20px; 
            color: #81d4fa; /* আরও হালকা নীল রঙ */
            opacity: 0.95;
            margin-bottom: 40px;
            text-shadow: 0px 2px 8px rgba(0,0,0,0.3);
        }

        /* লোডার ডিজাইন */
        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loader {
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
        }

        /* অ্যানিমেশনসমূহ */
        @keyframes pulseGlow {
            from { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="intro-container">
        <div class="logo-wrapper">
            <img src="logosujonsir.png" alt="Sujon Sir" class="intro-logo">
        </div>
        
        <div class="welcome-text">
            "জ্ঞানের পথে তোমার প্রতিটি পদক্ষেপে,
            <span>আমি আছি তোমার সাথে।"</span>
        </div>
        
        <div class="sub-text">তোমার জন্য শুভকামনা রইলো।</div>

        <div class="loader-wrapper">
            <div class="loader"></div>
            <div style="font-size: 12px; letter-spacing: 1px; opacity: 0.7; margin-top: 5px;">প্রবেশ করছি...</div>
        </div>
    </div>

    <script>
        setTimeout(function(){
            window.location.href = 'home.html';
        }, 3800);
    </script>
</body>
</html>
