<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম | Self Study with Sujon Sir</title>
    <meta http-equiv="refresh" content="3.5;url=home.html">
    <style>
        @font-face {
            font-family: 'FontOne';
            src: url('banglafont4.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'FontTwo';
            src: url('banglafont5.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            /* আকাশী, নেভি ব্লু ও কালোর আকর্ষণীয় গ্রেডিয়েন্ট */
            background: linear-gradient(135deg, #00d4ff 0%, #001a33 50%, #000000 100%);
            overflow: hidden; color: white; font-family: sans-serif;
            position: relative;
        }

        .intro-container { 
            text-align: center; 
            padding: 20px; 
            width: 100%; 
            max-width: 600px; 
            z-index: 10;
        }

        .logo-wrapper { position: relative; display: inline-block; margin-bottom: 30px; }

        .logo-wrapper::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 140%; height: 140%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            transform: translate(-50%, -50%); z-index: -1;
            animation: pulseGlow 3s infinite alternate;
        }

        .intro-logo {
            width: 320px; 
            height: auto; 
            border-radius: 50%;
            border: 6px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            animation: floating 3s ease-in-out infinite;
        }

        /* মোবাইলের জন্য লোগো সাইজ অ্যাডজাস্ট */
        @media (max-width: 600px) {
            .intro-logo { width: 240px; }
            .welcome-text { font-size: 22px !important; }
        }

        .welcome-text {
            font-family: 'FontOne', sans-serif; 
            font-size: 28px; 
            line-height: 1.5;
            color: #ffffff; 
            margin-bottom: 15px; 
            text-shadow: 0px 3px 12px rgba(0,0,0,0.3);
        }
        .welcome-text span { display: block; margin-top: 5px; }

        .sub-text {
            font-family: 'FontTwo', sans-serif; font-size: 22px;
            color: #ffd700; opacity: 1; margin-bottom: 40px;
            text-shadow: 0px 2px 8px rgba(0,0,0,0.4);
        }

        /* প্রগ্রেস বার (৩.৫ সেকেন্ড এনিমেশন) */
        .progress-container {
            width: 220px; height: 6px; background: rgba(255, 255, 255, 0.15);
            border-radius: 10px; margin: 0 auto; overflow: hidden; position: relative;
        }

        .progress-bar {
            width: 100%; height: 100%; background: linear-gradient(90deg, #00f2fe, #4facfe);
            position: absolute; left: -100%;
            animation: slideIn 3.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* ফুটার কপিরাইট একদম মাঝখানে */
        .footer-text {
            position: absolute; 
            bottom: 30px; 
            width: 100%;
            text-align: center;
            font-size: 13px; 
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
            left: 0;
        }

        @keyframes slideIn {
            0% { left: -100%; }
            100% { left: 0%; }
        }

        @keyframes pulseGlow {
            from { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
            to { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <div class="intro-container">
        <div class="logo-wrapper">
            <img src="logosujonsir.png" alt="Sujon Sir" class="intro-logo">
        </div>
        
        <div class="welcome-text">
            "জ্ঞানের পথে তোমার প্রতিটি পদক্ষেপে,
            <span>আমি আছি তোমার সাথে।”</span>
        </div>
        
        <div class="sub-text">তোমার জন্য শুভকামনা রইলো।</div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        <div style="font-size: 12px; margin-top: 12px; opacity: 0.8; letter-spacing: 3px; text-transform: uppercase;">লোড হচ্ছে</div>
    </div>

    <div class="footer-text">
        &copy; 2026 Self Study with Sujon Sir | Developed for Students
    </div>

    <script>
        setTimeout(function(){
            window.location.href = 'home.html';
        }, 3500);
    </script>
</body>
</html>
